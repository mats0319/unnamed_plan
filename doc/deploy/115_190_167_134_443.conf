server {
	listen 443 ssl;
	http2 on;
	server_name 115.190.167.134;

	ssl_certificate /home/cert/server.crt;
	ssl_certificate_key /home/cert/server.key;

	add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload"; # HSTS config

	gzip on;
	gzip_min_length 10k; # default 20 bytes;
	gzip_types application/javascript text/css image/svg+xml application/wasm;
	gzip_vary on;
	gzip_static on;

    limit_req_status 429;
    limit_conn_status 429;
	limit_req_zone $binary_remote_addr zone=api:10m rate=1r/s; # ip级请求/并发连接数量限制
	limit_conn_zone $binary_remote_addr zone=api:10m;

	location / {
		root /home/mario/dist;
		index index.html;
	}

	location /api {
	    limit_req zone=api burst=3 nodelay;
	    limit_conn api 20;

		proxy_pass http://127.0.0.1:10319/api;
	}
}